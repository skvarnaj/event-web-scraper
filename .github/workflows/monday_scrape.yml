name: Monday Morning Scrape

on:
  schedule:
    # 9:00 AM EST is 2:00 PM UTC
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows you to run it manually via the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas playwright pytz requests python-dotenv
          playwright install chromium

      - name: Run scraper
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "Auto-update links" || exit 0
          git push